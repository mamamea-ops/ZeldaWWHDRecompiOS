name: iOS IPA Build with GameController & File Picker

on:
  workflow_dispatch:
    inputs:
      aspect_ratio:
        description: Aspect Ratio
        required: true
        default: "10:7"
        type: choice
        options:
          - "16:9"
          - "10:7"
          - "16:10"
          - "21:9"
          - "32:9"

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      IOS_SDK: /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
      APP_NAME: ZeldaWWHD
      APP_VERSION: 0.2.11
      ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio || '10:7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        shell: bash
        run: |
          set -eux
          xcode-select -p
          xcodebuild -version
          brew install cmake ninja python@3.12 zstd xcodegen
          python3 --version

      - name: Generate recompiled game code
        shell: bash
        run: |
          set -eux
          if [ -f game/code/cking.rpx ]; then
            mkdir -p build/gen
            python3 tools/recomp/recomp.py game/code/cking.rpx build/gen
          else
            echo "WARNING: game/code/cking.rpx not found."
            echo "This build does not ship proprietary game files."
            echo "Users must dump their own USA Zelda Wind Waker HD files from a modded Wii U."
            echo ""
            echo "Required files to dump from your modded Wii U:"
            echo "  • USA Zelda Wind Waker HD disc image (WUD/WUX format)"
            echo "  • USA disc key (WUD/WUX only)"
            echo "  • USA Wii U common key (WUD/WUX)"
            echo ""
            echo "The app will provide file/folder pickers at runtime for users to supply their dumped files."
            mkdir -p build/gen
            touch build/gen/.placeholder
          fi

      - name: Build game engine as iOS library
        shell: bash
        run: |
          set -eux
          mkdir -p build/ios
          cmake -S . -B build/ios \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWWHD_RENDERER=METAL
          cmake --build build/ios --target wwhd_engine

      - name: Create iOS app scaffolding
        shell: bash
        run: |
          set -eux
          mkdir -p ios/ZeldaWWHD/Resources
          mkdir -p ios/ZeldaWWHD/Sources
          mkdir -p ios/ZeldaWWHD/Assets.xcassets/AppIcon.appiconset

          cat > ios/ZeldaWWHD/Sources/AppDelegate.mm <<'EOFAPP'
          #import <UIKit/UIKit.h>
          #import <Metal/Metal.h>
          #import <MetalKit/MetalKit.h>
          #import <GameController/GameController.h>
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          extern "C" {
              int wwhd_main(int argc, char** argv);
              void wwhd_handle_gamepad_input(int padIndex, const char* buttonName, int pressed);
              void wwhd_set_aspect_ratio(const char* ratio);
          }

          @interface GamepadManager : NSObject
          - (instancetype)init;
          - (void)setupGamepadMonitoring;
          @end

          @implementation GamepadManager

          - (instancetype)init {
              self = [super init];
              if (self) {
                  [self setupGamepadMonitoring];
              }
              return self;
          }

          - (void)setupGamepadMonitoring {
              [[NSNotificationCenter defaultCenter] addObserverForName:GCControllerDidConnectNotification
                  object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification *note) {
                  [self configureController:(GCController *)note.object];
              }];
              [[NSNotificationCenter defaultCenter] addObserverForName:GCControllerDidDisconnectNotification
                  object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification *note) {
              }];
              [GCController startWirelessControllerDiscoveryWithCompletionHandler:^{}];
          }

          - (void)configureController:(GCController *)controller {
              if (!controller) return;
              GCExtendedGamepad *pad = controller.extendedGamepad;
              if (!pad) return;

              NSInteger padIndex = [GCController controllers].count;
              pad.buttonA.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "A", pressed ? 1 : 0);
              };
              pad.buttonB.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "B", pressed ? 1 : 0);
              };
              pad.buttonX.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "X", pressed ? 1 : 0);
              };
              pad.buttonY.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "Y", pressed ? 1 : 0);
              };
              pad.dpad.up.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "DPAD_UP", pressed ? 1 : 0);
              };
              pad.dpad.down.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "DPAD_DOWN", pressed ? 1 : 0);
              };
              pad.dpad.left.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "DPAD_LEFT", pressed ? 1 : 0);
              };
              pad.dpad.right.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "DPAD_RIGHT", pressed ? 1 : 0);
              };
              pad.leftShoulder.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "L", pressed ? 1 : 0);
              };
              pad.rightShoulder.pressedChangedHandler = ^(GCControllerButtonInput *button, float value, BOOL pressed) {
                  wwhd_handle_gamepad_input((int)padIndex, "R", pressed ? 1 : 0);
              };
              pad.leftThumbstick.valueChangedHandler = ^(GCControllerDirectionPad *dpad, float xValue, float yValue) {
                  wwhd_handle_gamepad_input((int)padIndex, "LSTICK_X", (int)(xValue * 127));
                  wwhd_handle_gamepad_input((int)padIndex, "LSTICK_Y", (int)(yValue * 127));
              };
              pad.rightThumbstick.valueChangedHandler = ^(GCControllerDirectionPad *dpad, float xValue, float yValue) {
                  wwhd_handle_gamepad_input((int)padIndex, "RSTICK_X", (int)(xValue * 127));
                  wwhd_handle_gamepad_input((int)padIndex, "RSTICK_Y", (int)(yValue * 127));
              };
          }
          @end

          @interface SetupViewController : UIViewController <UIDocumentPickerDelegate>
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) NSString *selectedGameImagePath;
          @property (nonatomic, strong) NSString *selectedDiscKeyPath;
          @property (nonatomic, strong) NSString *selectedCommonKeyPath;
          @property (nonatomic) BOOL useFolder;
          @property (nonatomic, strong) NSString *selectedFolderPath;
          @property (nonatomic, strong) UIButton *startButton;
          - (void)setupUI;
          - (void)pickGameImage;
          - (void)pickDiscKey;
          - (void)pickCommonKey;
          - (void)pickFolder;
          - (void)startGame;
          - (void)updateStatusLabel;
          @end

          @implementation SetupViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor blackColor];
              self.useFolder = NO;
              [self setupUI];
          }

          - (void)setupUI {
              UIScrollView *scrollView = [[UIScrollView alloc] initWithFrame:self.view.bounds];
              scrollView.backgroundColor = [UIColor blackColor];
              [self.view addSubview:scrollView];

              UIView *contentView = [[UIView alloc] init];
              contentView.backgroundColor = [UIColor blackColor];
              [scrollView addSubview:contentView];

              // Title
              UILabel *titleLabel = [[UILabel alloc] init];
              titleLabel.text = @"Zelda Wind Waker HD";
              titleLabel.textColor = [UIColor whiteColor];
              titleLabel.font = [UIFont boldSystemFontOfSize:28];
              titleLabel.textAlignment = NSTextAlignmentCenter;
              [contentView addSubview:titleLabel];

              // Subtitle
              UILabel *subtitleLabel = [[UILabel alloc] init];
              subtitleLabel.text = @"Setup Required";
              subtitleLabel.textColor = [UIColor systemGrayColor];
              subtitleLabel.font = [UIFont systemFontOfSize:16];
              subtitleLabel.textAlignment = NSTextAlignmentCenter;
              [contentView addSubview:subtitleLabel];

              // Instructions
              UILabel *instructionLabel = [[UILabel alloc] init];
              instructionLabel.text = @"You must dump the following from your modded Wii U:\n\n📀 USA Zelda Wind Waker HD disc image (WUD/WUX)\n🔑 USA disc key (WUD/WUX only)\n🔐 USA Wii U common key (WUD/WUX)";
              instructionLabel.textColor = [UIColor lightGrayColor];
              instructionLabel.font = [UIFont systemFontOfSize:14];
              instructionLabel.numberOfLines = 0;
              instructionLabel.textAlignment = NSTextAlignmentCenter;
              [contentView addSubview:instructionLabel];

              // Legal disclaimer
              UIView *disclaimerView = [[UIView alloc] init];
              disclaimerView.backgroundColor = [UIColor systemRedColor];
              disclaimerView.layer.cornerRadius = 8;
              [contentView addSubview:disclaimerView];

              UILabel *legalLabel = [[UILabel alloc] init];
              legalLabel.text = @"⚠️  LEGAL: You may only use files dumped from a Wii U you own. Distributing or using game files without ownership is illegal.";
              legalLabel.textColor = [UIColor whiteColor];
              legalLabel.font = [UIFont systemFontOfSize:12];
              legalLabel.numberOfLines = 0;
              legalLabel.textAlignment = NSTextAlignmentCenter;
              [disclaimerView addSubview:legalLabel];

              // Mode selection
              UILabel *modeLabel = [[UILabel alloc] init];
              modeLabel.text = @"📂 Select Setup Mode:";
              modeLabel.textColor = [UIColor whiteColor];
              modeLabel.font = [UIFont boldSystemFontOfSize:16];
              [contentView addSubview:modeLabel];

              // Folder mode button
              UIButton *folderButton = [[UIButton alloc] init];
              [folderButton setTitle:@"📁 Pick Folder with All Files" forState:UIControlStateNormal];
              [folderButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              folderButton.backgroundColor = [UIColor systemBlueColor];
              folderButton.layer.cornerRadius = 8;
              folderButton.titleLabel.font = [UIFont boldSystemFontOfSize:16];
              [folderButton addTarget:self action:@selector(pickFolder) forControlEvents:UIControlEventTouchUpInside];
              [contentView addSubview:folderButton];

              UILabel *folderDescLabel = [[UILabel alloc] init];
              folderDescLabel.text = @"Select a folder containing cking.wud/wux, disc_key.bin, and common_key.bin";
              folderDescLabel.textColor = [UIColor systemGrayColor];
              folderDescLabel.font = [UIFont systemFontOfSize:12];
              folderDescLabel.numberOfLines = 0;
              folderDescLabel.textAlignment = NSTextAlignmentCenter;
              [contentView addSubview:folderDescLabel];

              // Divider
              UIView *divider = [[UIView alloc] init];
              divider.backgroundColor = [UIColor systemGrayColor];
              [contentView addSubview:divider];

              UILabel *orLabel = [[UILabel alloc] init];
              orLabel.text = @"OR";
              orLabel.textColor = [UIColor systemGrayColor];
              orLabel.font = [UIFont boldSystemFontOfSize:14];
              orLabel.textAlignment = NSTextAlignmentCenter;
              [contentView addSubview:orLabel];

              // Individual files mode
              UILabel *filesLabel = [[UILabel alloc] init];
              filesLabel.text = @"📋 Pick Files Individually:";
              filesLabel.textColor = [UIColor whiteColor];
              filesLabel.font = [UIFont boldSystemFontOfSize:16];
              [contentView addSubview:filesLabel];

              // Game image button
              UIButton *gameButton = [[UIButton alloc] init];
              [gameButton setTitle:@"📀 Select Game Image (WUD/WUX)" forState:UIControlStateNormal];
              [gameButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              gameButton.backgroundColor = [UIColor systemGreenColor];
              gameButton.layer.cornerRadius = 8;
              gameButton.titleLabel.font = [UIFont boldSystemFontOfSize:15];
              [gameButton addTarget:self action:@selector(pickGameImage) forControlEvents:UIControlEventTouchUpInside];
              [contentView addSubview:gameButton];

              // Disc key button
              UIButton *discKeyButton = [[UIButton alloc] init];
              [discKeyButton setTitle:@"🔑 Select Disc Key (disc_key.bin)" forState:UIControlStateNormal];
              [discKeyButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              discKeyButton.backgroundColor = [UIColor systemOrangeColor];
              discKeyButton.layer.cornerRadius = 8;
              discKeyButton.titleLabel.font = [UIFont boldSystemFontOfSize:15];
              [discKeyButton addTarget:self action:@selector(pickDiscKey) forControlEvents:UIControlEventTouchUpInside];
              [contentView addSubview:discKeyButton];

              // Common key button
              UIButton *commonKeyButton = [[UIButton alloc] init];
              [commonKeyButton setTitle:@"🔐 Select Common Key (common_key.bin)" forState:UIControlStateNormal];
              [commonKeyButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              commonKeyButton.backgroundColor = [UIColor systemPurpleColor];
              commonKeyButton.layer.cornerRadius = 8;
              commonKeyButton.titleLabel.font = [UIFont boldSystemFontOfSize:15];
              [commonKeyButton addTarget:self action:@selector(pickCommonKey) forControlEvents:UIControlEventTouchUpInside];
              [contentView addSubview:commonKeyButton];

              // Status label
              self.statusLabel = [[UILabel alloc] init];
              self.statusLabel.text = @"Status: No files selected";
              self.statusLabel.textColor = [UIColor systemYellowColor];
              self.statusLabel.font = [UIFont systemFontOfSize:13];
              self.statusLabel.numberOfLines = 0;
              self.statusLabel.textAlignment = NSTextAlignmentCenter;
              [contentView addSubview:self.statusLabel];

              // Start button
              self.startButton = [[UIButton alloc] init];
              [self.startButton setTitle:@"▶️ Start Game" forState:UIControlStateNormal];
              [self.startButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.startButton.backgroundColor = [UIColor systemRedColor];
              self.startButton.layer.cornerRadius = 8;
              self.startButton.titleLabel.font = [UIFont boldSystemFontOfSize:16];
              [self.startButton addTarget:self action:@selector(startGame) forControlEvents:UIControlEventTouchUpInside];
              self.startButton.alpha = 0.5;
              self.startButton.enabled = NO;
              [contentView addSubview:self.startButton];

              // Layout using AutoLayout
              scrollView.translatesAutoresizingMaskIntoConstraints = NO;
              contentView.translatesAutoresizingMaskIntoConstraints = NO;
              [contentView.widthAnchor constraintEqualToAnchor:scrollView.widthAnchor].active = YES;

              CGFloat padding = 20;
              CGFloat buttonHeight = 50;
              CGFloat spacing = 12;

              [NSLayoutConstraint activateConstraints:@[
                  [scrollView.topAnchor constraintEqualToAnchor:self.view.topAnchor],
                  [scrollView.bottomAnchor constraintEqualToAnchor:self.view.bottomAnchor],
                  [scrollView.leftAnchor constraintEqualToAnchor:self.view.leftAnchor],
                  [scrollView.rightAnchor constraintEqualToAnchor:self.view.rightAnchor],

                  [contentView.topAnchor constraintEqualToAnchor:scrollView.topAnchor constant:padding],
                  [contentView.bottomAnchor constraintEqualToAnchor:scrollView.bottomAnchor constant:-padding],
                  [contentView.leftAnchor constraintEqualToAnchor:scrollView.leftAnchor constant:16],
                  [contentView.rightAnchor constraintEqualToAnchor:scrollView.rightAnchor constant:-16],
              ]];

              titleLabel.translatesAutoresizingMaskIntoConstraints = NO;
              subtitleLabel.translatesAutoresizingMaskIntoConstraints = NO;
              instructionLabel.translatesAutoresizingMaskIntoConstraints = NO;
              disclaimerView.translatesAutoresizingMaskIntoConstraints = NO;
              legalLabel.translatesAutoresizingMaskIntoConstraints = NO;
              modeLabel.translatesAutoresizingMaskIntoConstraints = NO;
              folderButton.translatesAutoresizingMaskIntoConstraints = NO;
              folderDescLabel.translatesAutoresizingMaskIntoConstraints = NO;
              divider.translatesAutoresizingMaskIntoConstraints = NO;
              orLabel.translatesAutoresizingMaskIntoConstraints = NO;
              filesLabel.translatesAutoresizingMaskIntoConstraints = NO;
              gameButton.translatesAutoresizingMaskIntoConstraints = NO;
              discKeyButton.translatesAutoresizingMaskIntoConstraints = NO;
              commonKeyButton.translatesAutoresizingMaskIntoConstraints = NO;
              self.statusLabel.translatesAutoresizingMaskIntoConstraints = NO;
              self.startButton.translatesAutoresizingMaskIntoConstraints = NO;

              [NSLayoutConstraint activateConstraints:@[
                  [titleLabel.topAnchor constraintEqualToAnchor:contentView.topAnchor],
                  [titleLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [titleLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [subtitleLabel.topAnchor constraintEqualToAnchor:titleLabel.bottomAnchor constant:4],
                  [subtitleLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [subtitleLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [instructionLabel.topAnchor constraintEqualToAnchor:subtitleLabel.bottomAnchor constant:16],
                  [instructionLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [instructionLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [disclaimerView.topAnchor constraintEqualToAnchor:instructionLabel.bottomAnchor constant:16],
                  [disclaimerView.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [disclaimerView.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [legalLabel.topAnchor constraintEqualToAnchor:disclaimerView.topAnchor constant:12],
                  [legalLabel.bottomAnchor constraintEqualToAnchor:disclaimerView.bottomAnchor constant:-12],
                  [legalLabel.leftAnchor constraintEqualToAnchor:disclaimerView.leftAnchor constant:12],
                  [legalLabel.rightAnchor constraintEqualToAnchor:disclaimerView.rightAnchor constant:-12],

                  [modeLabel.topAnchor constraintEqualToAnchor:disclaimerView.bottomAnchor constant:20],
                  [modeLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [modeLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [folderButton.topAnchor constraintEqualToAnchor:modeLabel.bottomAnchor constant:spacing],
                  [folderButton.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [folderButton.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],
                  [folderButton.heightAnchor constraintEqualToConstant:buttonHeight],

                  [folderDescLabel.topAnchor constraintEqualToAnchor:folderButton.bottomAnchor constant:8],
                  [folderDescLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [folderDescLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [divider.topAnchor constraintEqualToAnchor:folderDescLabel.bottomAnchor constant:16],
                  [divider.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [divider.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],
                  [divider.heightAnchor constraintEqualToConstant:1],

                  [orLabel.topAnchor constraintEqualToAnchor:divider.bottomAnchor constant:8],
                  [orLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [orLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [filesLabel.topAnchor constraintEqualToAnchor:orLabel.bottomAnchor constant:12],
                  [filesLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [filesLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [gameButton.topAnchor constraintEqualToAnchor:filesLabel.bottomAnchor constant:spacing],
                  [gameButton.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [gameButton.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],
                  [gameButton.heightAnchor constraintEqualToConstant:buttonHeight],

                  [discKeyButton.topAnchor constraintEqualToAnchor:gameButton.bottomAnchor constant:spacing],
                  [discKeyButton.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [discKeyButton.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],
                  [discKeyButton.heightAnchor constraintEqualToConstant:buttonHeight],

                  [commonKeyButton.topAnchor constraintEqualToAnchor:discKeyButton.bottomAnchor constant:spacing],
                  [commonKeyButton.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [commonKeyButton.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],
                  [commonKeyButton.heightAnchor constraintEqualToConstant:buttonHeight],

                  [self.statusLabel.topAnchor constraintEqualToAnchor:commonKeyButton.bottomAnchor constant:20],
                  [self.statusLabel.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [self.statusLabel.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],

                  [self.startButton.topAnchor constraintEqualToAnchor:self.statusLabel.bottomAnchor constant:20],
                  [self.startButton.leftAnchor constraintEqualToAnchor:contentView.leftAnchor],
                  [self.startButton.rightAnchor constraintEqualToAnchor:contentView.rightAnchor],
                  [self.startButton.heightAnchor constraintEqualToConstant:buttonHeight],
                  [self.startButton.bottomAnchor constraintEqualToAnchor:contentView.bottomAnchor]
              ]];
          }

          - (void)pickFolder {
              UIDocumentPickerViewController *picker = [[UIDocumentPickerViewController alloc]
                  initForOpeningContentTypes:@[UTTypeFolder] asCopy:NO];
              picker.delegate = self;
              picker.allowsMultipleSelection = NO;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)pickGameImage {
              UIDocumentPickerViewController *picker = [[UIDocumentPickerViewController alloc]
                  initForOpeningContentTypes:@[UTTypeData] asCopy:NO];
              picker.delegate = self;
              picker.allowsMultipleSelection = NO;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)pickDiscKey {
              UIDocumentPickerViewController *picker = [[UIDocumentPickerViewController alloc]
                  initForOpeningContentTypes:@[UTTypeData] asCopy:NO];
              picker.delegate = self;
              picker.allowsMultipleSelection = NO;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)pickCommonKey {
              UIDocumentPickerViewController *picker = [[UIDocumentPickerViewController alloc]
                  initForOpeningContentTypes:@[UTTypeData] asCopy:NO];
              picker.delegate = self;
              picker.allowsMultipleSelection = NO;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController *)controller
              didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              if (urls.count == 0) return;
              NSURL *url = urls[0];
              NSString *path = [url path];

              // Check if it's a directory
              BOOL isDir = NO;
              [[NSFileManager defaultManager] fileExistsAtPath:path isDirectory:&isDir];
              if (isDir) {
                  self.useFolder = YES;
                  self.selectedFolderPath = path;
                  self.selectedGameImagePath = nil;
                  self.selectedDiscKeyPath = nil;
                  self.selectedCommonKeyPath = nil;
                  [self updateStatusLabel];
                  return;
              }

              // File selection - determine which file based on name
              NSString *filename = [path lastPathComponent];
              NSString *lowerFilename = filename.lowercaseString;
              
              if ([lowerFilename hasSuffix:@".wud"] || [lowerFilename hasSuffix:@".wux"]) {
                  self.useFolder = NO;
                  self.selectedGameImagePath = path;
              } else if ([lowerFilename isEqualToString:@"disc_key.bin"]) {
                  self.useFolder = NO;
                  self.selectedDiscKeyPath = path;
              } else if ([lowerFilename isEqualToString:@"common_key.bin"]) {
                  self.useFolder = NO;
                  self.selectedCommonKeyPath = path;
              }
              
              [self updateStatusLabel];
          }

          - (void)updateStatusLabel {
              if (self.useFolder && self.selectedFolderPath) {
                  self.statusLabel.text = [NSString stringWithFormat:@"✅ Folder selected: %@", [self.selectedFolderPath lastPathComponent]];
                  self.statusLabel.textColor = [UIColor systemGreenColor];
                  self.startButton.enabled = YES;
                  self.startButton.alpha = 1.0;
              } else if (self.selectedGameImagePath && self.selectedDiscKeyPath && self.selectedCommonKeyPath) {
                  self.statusLabel.text = [NSString stringWithFormat:@"✅ All files selected:\n%@\ndisc_key.bin\ncommon_key.bin", 
                      [self.selectedGameImagePath lastPathComponent]];
                  self.statusLabel.textColor = [UIColor systemGreenColor];
                  self.startButton.enabled = YES;
                  self.startButton.alpha = 1.0;
              } else {
                  NSMutableString *status = [[NSMutableString alloc] initWithString:@"📋 Status:\n"];
                  [status appendString:self.selectedGameImagePath ? [NSString stringWithFormat:@"✓ Game: %@\n", [self.selectedGameImagePath lastPathComponent]] : @"○ Game image\n"];
                  [status appendString:self.selectedDiscKeyPath ? @"✓ Disc Key\n" : @"○ Disc key\n"];
                  [status appendString:self.selectedCommonKeyPath ? @"✓ Common Key" : @"○ Common key"];
                  
                  self.statusLabel.text = status;
                  self.statusLabel.textColor = [UIColor systemYellowColor];
                  self.startButton.enabled = NO;
                  self.startButton.alpha = 0.5;
              }
          }

          - (void)startGame {
              NSString *folderPath = nil;
              
              if (self.useFolder && self.selectedFolderPath) {
                  folderPath = self.selectedFolderPath;
              } else if (self.selectedGameImagePath && self.selectedDiscKeyPath && self.selectedCommonKeyPath) {
                  folderPath = [self.selectedGameImagePath stringByDeletingLastPathComponent];
              } else {
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Missing Files"
                      message:@"Please select either a folder with all files or all three individual files (game image, disc key, and common key)."
                      preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil];
                  return;
              }

              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                  int argc = 2;
                  const char *argv[] = { "wwhd", [folderPath UTF8String], NULL };
                  wwhd_main(argc, (char**)argv);
              });
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @property (nonatomic, strong) GamepadManager *gamepadManager;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              
              SetupViewController *setupVC = [[SetupViewController alloc] init];
              self.window.rootViewController = setupVC;
              self.window.backgroundColor = [UIColor blackColor];
              [self.window makeKeyAndVisible];

              self.gamepadManager = [[GamepadManager alloc] init];

              NSString *ratio = @"10:7";
              wwhd_set_aspect_ratio([ratio UTF8String]);

              return YES;
          }

          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOFAPP

          cat > ios/ZeldaWWHD/Sources/GameControllerBridge.cpp <<'EOFBRIDGE'
          #include <iostream>
          #include <map>
          #include <string>

          struct GamepadState {
              int buttonA = 0;
              int buttonB = 0;
              int buttonX = 0;
              int buttonY = 0;
              int dpadUp = 0;
              int dpadDown = 0;
              int dpadLeft = 0;
              int dpadRight = 0;
              int shoulderL = 0;
              int shoulderR = 0;
              int lstickX = 0;
              int lstickY = 0;
              int rstickX = 0;
              int rstickY = 0;
          };

          static GamepadState gGamepads[4];

          extern "C" {
              void wwhd_handle_gamepad_input(int padIndex, const char* buttonName, int pressed) {
                  if (padIndex < 0 || padIndex >= 4) return;
                  GamepadState &pad = gGamepads[padIndex];
                  std::string button(buttonName);

                  if (button == "A") pad.buttonA = pressed;
                  else if (button == "B") pad.buttonB = pressed;
                  else if (button == "X") pad.buttonX = pressed;
                  else if (button == "Y") pad.buttonY = pressed;
                  else if (button == "DPAD_UP") pad.dpadUp = pressed;
                  else if (button == "DPAD_DOWN") pad.dpadDown = pressed;
                  else if (button == "DPAD_LEFT") pad.dpadLeft = pressed;
                  else if (button == "DPAD_RIGHT") pad.dpadRight = pressed;
                  else if (button == "L") pad.shoulderL = pressed;
                  else if (button == "R") pad.shoulderR = pressed;
                  else if (button == "LSTICK_X") pad.lstickX = pressed;
                  else if (button == "LSTICK_Y") pad.lstickY = pressed;
                  else if (button == "RSTICK_X") pad.rstickX = pressed;
                  else if (button == "RSTICK_Y") pad.rstickY = pressed;
              }

              const GamepadState* wwhd_get_gamepad_state(int padIndex) {
                  if (padIndex < 0 || padIndex >= 4) return nullptr;
                  return &gGamepads[padIndex];
              }
          }
          EOFBRIDGE

          cat > ios/ZeldaWWHD/Sources/FilePickerBridge.mm <<'EOFFILE'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          typedef void (*FilePickerCallback)(const char*);
          static FilePickerCallback gFilePickerCallback = nil;

          @interface FilePickerManager : NSObject <UIDocumentPickerDelegate>
          @end

          @implementation FilePickerManager
          - (void)documentPicker:(UIDocumentPickerViewController *)controller
              didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              if (urls.count > 0 && gFilePickerCallback) {
                  NSURL *url = urls[0];
                  const char *path = [[url path] UTF8String];
                  gFilePickerCallback(path);
              }
          }
          @end

          extern "C" {
              void wwhd_set_aspect_ratio(const char* ratio) {
                  NSLog(@"[WWHD] Aspect ratio: %s", ratio);
              }

              void wwhd_open_file_picker(const char* documentType, FilePickerCallback callback) {
                  gFilePickerCallback = callback;

                  dispatch_async(dispatch_get_main_queue(), ^(void) {
                      UIDocumentPickerViewController *picker = nil;

                      if (@available(iOS 14, *)) {
                          if (strcmp(documentType, "folder") == 0) {
                              picker = [[UIDocumentPickerViewController alloc]
                                  initForOpeningContentTypes:@[UTTypeFolder] asCopy:NO];
                          } else if (strcmp(documentType, "image") == 0) {
                              picker = [[UIDocumentPickerViewController alloc]
                                  initForOpeningContentTypes:@[UTTypeImage] asCopy:NO];
                          } else {
                              picker = [[UIDocumentPickerViewController alloc]
                                  initForOpeningContentTypes:@[UTTypeData] asCopy:NO];
                          }
                      }

                      if (picker) {
                          FilePickerManager *delegate = [[FilePickerManager alloc] init];
                          picker.delegate = delegate;
                          UIViewController *rootVC = [[UIApplication sharedApplication].windows firstObject].rootViewController;
                          [rootVC presentViewController:picker animated:YES completion:nil];
                      }
                  });
              }
          }
          EOFFILE

